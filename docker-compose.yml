# Self-hosted: Postgres (MLflow) + MinIO (MLflow + DVC artifacts) + MLflow + Feast UI + FastAPI.
# DVC: `train` runs `dvc repro` (see docker/train-pipeline.sh) with `.dvc/cache` on a volume and optional MinIO remote.
# Feast: registry + SQLite online store live on volume `feast_registry` (`data/feast/`); UI browses the registry.
#
#   cp .env.docker.example .env   # set PUBLIC_HOST + passwords (required for correct MinIO browser URLs)
#   docker compose build && docker compose up -d
#   docker compose --profile train run --rm train && docker compose restart app
#   curl http://localhost:8080/healthz
#
# Ports — host side is always 0.0.0.0 so the VM public IP reaches these services
# (still requires cloud firewall / security-group rules for the same TCP ports).
#   API ${APP_PORT:-8080}, MLflow ${MLFLOW_PORT:-5000}, Feast UI ${FEAST_UI_PORT:-8888},
#   MinIO API ${MINIO_API_PORT:-9000}, console ${MINIO_CONSOLE_PORT:-9001}
# MinIO S3 credentials: optional MINIO_ACCESS_KEY / MINIO_SECRET_KEY (service account); if unset,
# MLflow / app / train use MINIO_ROOT_USER / MINIO_ROOT_PASSWORD. Create keys: scripts/minio_create_s3_credentials.sh
# Postgres is NOT published (internal only). Set PUBLIC_HOST in .env and run: bash scripts/test_public_endpoints.sh
#
# `app`, `feast-ui`, and `train` share one image tag so a single `docker compose build` refreshes all.

x-python-runner: &python_runner
  build: .
  image: mlproject/python-runner:local

services:
  postgres:
    image: postgres:15-alpine
    # Intentionally no host ports: DB stays on the Docker network only (not on public IP).
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_dev_change_me}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
      # Browser + SDK see the VM by PUBLIC_HOST (from .env); defaults to 127.0.0.1 if unset.
      MINIO_SERVER_URL: http://${PUBLIC_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}
      MINIO_BROWSER_REDIRECT_URL: http://${PUBLIC_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}
    volumes:
      - minio_data:/data
    ports:
      # S3 API + web console — bind all interfaces so PUBLIC_HOST:PORT works behind a firewall.
      - "0.0.0.0:${MINIO_API_PORT:-9000}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT:-9001}:9001"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${POSTGRES_PASSWORD:-mlflow_dev_change_me}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin_change_me}}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "0.0.0.0:${MLFLOW_PORT:-5000}:5000"

  feast-ui:
    <<: *python_runner
    depends_on:
      - minio
    working_dir: /app/feature_repo
    volumes:
      - feast_registry:/app/data/feast
    command: ["feast", "ui", "--host", "0.0.0.0", "--port", "8888"]
    ports:
      - "0.0.0.0:${FEAST_UI_PORT:-8888}:8888"

  app:
    <<: *python_runner
    depends_on:
      - mlflow
      - minio
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin_change_me}}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - feast_registry:/app/data/feast
      - models_vol:/app/models
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:8080"

  train:
    <<: *python_runner
    profiles: ["train"]
    depends_on:
      - mlflow
      - minio
    entrypoint: ["/bin/sh", "/app/docker/train-pipeline.sh"]
    environment:
      CONFIGURE_DVC_MINIO_REMOTE: ${CONFIGURE_DVC_MINIO_REMOTE:-1}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin_change_me}}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - feast_registry:/app/data/feast
      - models_vol:/app/models
      - raw_data:/app/data/raw
      - processed_data:/app/data/processed
      - dvc_cache:/app/.dvc/cache
    command: ["python", "pipelines/run_pipeline.py"]

volumes:
  postgres_data:
  minio_data:
  feast_registry:
  models_vol:
  raw_data:
  processed_data:
  dvc_cache:
