# End-to-end CI: pytest → DVC bootstrap → train pipeline + batch predict → artifact checks
# → optional public HTTP checks → upload build outputs.
# Optional: point MLflow (and S3/MinIO) at your **public or hosted** URLs via repository secrets.
#
# Triggers: manual, push to main, pull requests (secrets empty on forks → local mlruns).
# Configure secrets under Settings → Secrets and variables → Actions.

name: ML demo pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ml-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map secrets to env (hosted MLflow / MinIO / API checks)
        env:
          S_MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          S_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S_MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
          S_AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S_API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          S_FEAST_UI_URL: ${{ secrets.FEAST_UI_URL }}
        run: |
          set -euxo pipefail
          echo "MLFLOW_TRACKING_URI=${S_MLFLOW_TRACKING_URI:-$GITHUB_WORKSPACE/mlruns}" >> "$GITHUB_ENV"
          if [ -n "${S_MLFLOW_S3_ENDPOINT_URL:-}" ]; then
            echo "MLFLOW_S3_ENDPOINT_URL=$S_MLFLOW_S3_ENDPOINT_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "${S_AWS_ACCESS_KEY_ID:-}" ]; then
            echo "AWS_ACCESS_KEY_ID=$S_AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "${S_AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "AWS_SECRET_ACCESS_KEY=$S_AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          fi
          echo "AWS_DEFAULT_REGION=${S_AWS_DEFAULT_REGION:-us-east-1}" >> "$GITHUB_ENV"
          if [ -n "${S_API_HEALTH_URL:-}" ]; then
            echo "API_HEALTH_URL=$S_API_HEALTH_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "${S_FEAST_UI_URL:-}" ]; then
            echo "FEAST_UI_URL=$S_FEAST_UI_URL" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wire DVC Python path (matches dvc.yaml ${py} and Dockerfile)
        run: |
          set -euxo pipefail
          mkdir -p .venv/bin
          ln -sf "$(which python)" .venv/bin/python

      - name: Unit tests (fail fast)
        run: python -m pytest tests/ -q --tb=short

      - name: Ensure DVC metadata
        run: test -d .dvc || dvc init --no-scm

      - name: Full pipeline + sample predict
        run: python pipelines/run_pipeline.py --full-demo

      - name: Validate pipeline outputs (E2E)
        run: python scripts/verify_outputs.py

      - name: Optional checks — public API + Feast UI
        run: |
          set -euxo pipefail
          if [ -n "${API_HEALTH_URL:-}" ]; then
            curl -fsS --max-time 30 "${API_HEALTH_URL%/}/healthz" | tee /tmp/ci_healthz.json
            python -c "import json; d=json.load(open('/tmp/ci_healthz.json')); assert d.get('status')=='ok', d"
          fi
          if [ -n "${FEAST_UI_URL:-}" ]; then
            curl -fsS --max-time 30 -o /dev/null "$FEAST_UI_URL"
          fi

      - name: E2E summary
        if: success()
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("metrics/train_metrics.json").read_text())
          print("train_metrics:", {k: m[k] for k in ("run_id", "accuracy", "f1_macro") if k in m})
          PY
          wc -l predictions.csv || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          if-no-files-found: warn
          path: |
            metrics/train_metrics.json
            predictions.csv
            data/raw/sensitive_records.csv
            data/processed/sensitive_features.parquet
            models/risk_label_classes.json
