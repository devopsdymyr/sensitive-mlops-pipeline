# Enterprise-friendly CI: manual run → full DVC pipeline + sample predict + artifacts.
# Run: Actions → "ML demo pipeline" → Run workflow.
# Requires token with repo + workflow scopes to update this file.

name: ML demo pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      MLFLOW_TRACKING_URI: ${{ github.workspace }}/mlruns

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure DVC metadata
        run: test -d .dvc || dvc init --no-scm

      - name: Full pipeline + sample predict
        run: python pipelines/run_pipeline.py --full-demo

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          if-no-files-found: warn
          path: |
            metrics/train_metrics.json
            predictions.csv
            data/raw/sensitive_records.csv
            data/processed/sensitive_features.parquet
