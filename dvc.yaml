# Sensitive data classification & risk scoring — DVC pipeline
vars:
  - py: .venv/bin/python

stages:
  generate_data:
    cmd: ${py} src/generate_dataset.py
    outs:
      - data/raw/sensitive_records.csv

  featurize:
    cmd: ${py} src/featurize.py
    deps:
      - data/raw/sensitive_records.csv
      - src/featurize.py
      - src/pii_detector.py
      - feature_repo/feature_store.yaml
      - feature_repo/repo.py
    outs:
      - data/processed/sensitive_features.parquet

  train:
    cmd: ${py} src/train.py
    deps:
      - data/processed/sensitive_features.parquet
      - src/train.py
      - feature_repo/feature_store.yaml
      - feature_repo/repo.py
      - params.yaml
    params:
      - params.yaml:
          - train.C
          - train.max_iter
          - train.test_size
          - mlflow.experiment_name
          - mlflow.registered_model_name
          - mlflow.model_alias
    metrics:
      - metrics/train_metrics.json:
          cache: false
